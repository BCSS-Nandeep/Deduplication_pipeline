[pytest]
pythonpath = .
testpaths = tests
markers =
    live: needs a running FR-DOPAMS service (skipped unless FR_DOPAMS_LIVE_URL, FR_DOPAMS_API_KEY and FR_LIVE_FIXTURE_DIR are set)
    sql_parity: executes candidate SQL as a read-only SELECT over in-statement fixture rows; skipped unless DEDUP_SQL_PARITY=1
